version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"

  # Covers requirements.txt. The komodo-api and releaseprobe versions pinned in
  # custom_components/komodo/manifest.json are NOT covered by Dependabot
  # and have to be bumped by hand.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python-dependencies:
        patterns:
          - "*"
