version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"

  # Covers requirements.txt and requirements_test.txt. Runtime deps live in
  # manifest.json, which Dependabot can't read; they're left unversioned in
  # requirements.txt and must be bumped in manifest.json by hand.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python-dependencies:
        patterns:
          - "*"
